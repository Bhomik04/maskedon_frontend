[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_APP_URL = "https://maskedon.com"

# ── Android App Links ──────────────────────────────────────────────────────────
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"

# ── SEO / Crawl Files ──────────────────────────────────────────────────────────
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# ── Security Headers (all pages) ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    X-XSS-Protection = "1; mode=block"

# ── HTTPS Redirects ────────────────────────────────────────────────────────────
# Force HTTPS — redirect all HTTP traffic to HTTPS
[[redirects]]
  from = "http://maskedon.com/*"
  to = "https://maskedon.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.maskedon.com/*"
  to = "https://maskedon.com/:splat"
  status = 301
  force = true

# Redirect www → apex (canonical domain)
[[redirects]]
  from = "https://www.maskedon.com/*"
  to = "https://maskedon.com/:splat"
  status = 301
  force = true

# SPA fallback — must be LAST so static files (incl. .well-known/) take priority
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

